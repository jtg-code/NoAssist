<!doctype html>
<html lang="de" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>NoAssist Dashboard</title>
  <!-- Kein Favicon-Request -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- Vendor (UMD, lokal): stellen die Globals DOMPurify und marked bereit; defer = vor den Modulen ausgeführt -->
  <script src="/static/vendor/purify.min.js" defer></script>
  <script src="/static/vendor/marked.min.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/devreload.js"></script>
</head>
<body>
  <!-- Icon-Sprite (statisch); JS referenziert die Symbole per <use> -->
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-agents" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
    <symbol id="i-browser" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></symbol>
  </svg>

  <a class="skip-link" href="#composer-input">Zur Eingabe springen</a>

  <div class="app" id="app" data-sidebar="open">
    <aside class="sidebar" id="sidebar" aria-label="Seitenleiste">
      <div class="sidebar-head">
        <span class="brand">NoAssist Dashboard</span>
        <button type="button" class="icon-btn" id="sidebar-close" aria-label="Seitenleiste schließen" aria-controls="sidebar">
          <svg class="icon" aria-hidden="true"><use href="#i-sidebar"/></svg>
        </button>
      </div>
      <button type="button" class="new-chat" id="new-chat">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        Neuer Chat
      </button>
      <nav class="chat-list" id="chat-list" aria-label="Chatverlauf"></nav>
      <div class="sidebar-foot">
        <button type="button" class="btn-ghost" id="open-settings">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
          Einstellungen
        </button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Seitenleiste öffnen" aria-controls="sidebar" aria-expanded="true" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <div class="model-picker" role="group" aria-label="Provider">
        <span class="status-dot" id="provider-dot" role="img" aria-label="Status: unbekannt" data-state="unknown"></span>
        <label class="visually-hidden" for="provider-select">Provider</label>
        <select id="provider-select"></select>
        </div>
        <span class="topbar-spacer"></span>
        <button type="button" class="icon-btn" id="browser-toggle" aria-label="Browser als Fenster öffnen" aria-pressed="false" title="Browser als Fenster öffnen" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-browser"/></svg>
        </button>
        <button type="button" class="icon-btn" id="agents-toggle" aria-label="Agenten-Leiste öffnen" aria-controls="agents-sidebar" aria-expanded="false">
          <svg class="icon" aria-hidden="true"><use href="#i-agents"/></svg>
        </button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Darstellung: System. Klicken zum Wechseln">
          <svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg>
        </button>
      </header>

      <main class="messages" id="messages" tabindex="-1">
        <h1 class="visually-hidden" id="chat-heading">Neuer Chat</h1>
        <div class="thread" id="thread"></div>
      </main>

      <div class="composer-wrap">
        <form class="composer" id="composer" aria-label="Nachricht verfassen">
          <div class="composer-box">
            <label class="visually-hidden" for="composer-input">Nachricht</label>
            <textarea id="composer-input" rows="1" placeholder="Nachricht an NoAssist" aria-describedby="composer-hint" autocomplete="off"></textarea>
            <div class="composer-tools">
              <div class="composer-selects" role="group" aria-label="Modell und Reasoning">
                <label class="visually-hidden" for="model-select">Modell</label>
                <select id="model-select" class="composer-select composer-select-model"></select>
                <label class="visually-hidden" for="reasoning-select">Reasoning-Stufe</label>
                <select id="reasoning-select" class="composer-select" title="Reasoning-Stufe"></select>
              </div>
              <button type="submit" class="send-btn" id="send-btn" aria-label="Senden" disabled>
                <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
              </button>
            </div>
          </div>
          <p class="composer-hint" id="composer-hint">Enter sendet, Umschalt+Enter fügt einen Zeilenumbruch ein, Esc bricht eine laufende Antwort ab.</p>
        </form>
      </div>
    </div>
    <aside class="agents-sidebar" id="agents-sidebar" aria-label="Subagenten">
      <div class="sidebar-head">
        <span class="brand">Subagenten</span>
        <button type="button" class="icon-btn" id="agents-close" aria-label="Agenten-Leiste schließen" aria-controls="agents-sidebar">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="agents-list" id="agents-list" aria-live="polite"></div>
    </aside>
  </div>

  <!-- Einstellungen -->
  <dialog class="dialog dialog-settings" id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-head">
      <h2 id="settings-title">Einstellungen</h2>
      <button type="button" class="icon-btn" id="settings-close" aria-label="Einstellungen schließen">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="settings-layout">
      <div class="tablist" role="tablist" aria-label="Bereiche" aria-orientation="vertical" id="settings-tabs">
        <button type="button" class="tab" role="tab" id="tab-general" aria-controls="panel-general" aria-selected="true">Allgemein</button>
        <button type="button" class="tab" role="tab" id="tab-providers" aria-controls="panel-providers" aria-selected="false" tabindex="-1">Provider</button>
        <button type="button" class="tab" role="tab" id="tab-tools" aria-controls="panel-tools" aria-selected="false" tabindex="-1">Tools</button>
        <button type="button" class="tab" role="tab" id="tab-agents" aria-controls="panel-agents" aria-selected="false" tabindex="-1">Agents</button>
        <button type="button" class="tab" role="tab" id="tab-roles" aria-controls="panel-roles" aria-selected="false" tabindex="-1">Agent-Modelle</button>
      </div>
      <section class="tabpanel" role="tabpanel" id="panel-general" aria-labelledby="tab-general" tabindex="0"></section>
      <section class="tabpanel" role="tabpanel" id="panel-providers" aria-labelledby="tab-providers" tabindex="0" hidden></section>
      <section class="tabpanel" role="tabpanel" id="panel-tools" aria-labelledby="tab-tools" tabindex="0" hidden></section>
      <section class="tabpanel" role="tabpanel" id="panel-agents" aria-labelledby="tab-agents" tabindex="0" hidden></section>
      <section class="tabpanel" role="tabpanel" id="panel-roles" aria-labelledby="tab-roles" tabindex="0" hidden></section>
    </div>
  </dialog>

  <!-- Bestätigung -->
  <dialog class="dialog dialog-confirm" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog">
      <h2 id="confirm-title">Bestätigen</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn" value="cancel" id="confirm-cancel">Abbrechen</button>
        <button type="submit" class="btn btn-primary" value="ok" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toasts"></div>
  <div class="visually-hidden" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
